site_name: Docling Qdrant Advanced RAG Harness
site_description: Unified document ingestion and advanced RAG microservice harness.
repo_name: docling-qdrant-rag-harness
site_dir: /tmp/mkdocs-site
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Architecture: architecture.md
  - API guide: api.md
  - RAG Queries & Qdrant: rag-querying.md
  - Chunking: chunking.md
  - LLM providers: llm-providers.md
  - Control plane: control-plane.md
  - Legacy port matrix: legacy-port.md
  - Configuration: configuration.md
  - Agent integration: agent-integration.md
  - Google Colab: colab.md
  - Operations: operations.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true
