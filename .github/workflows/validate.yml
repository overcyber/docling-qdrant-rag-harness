name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2.11,<3' 'pydantic-settings>=2.10,<3' 'PyYAML>=6,<7'

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Validate source, schemas, docs navigation and Colab syntax
        run: ./scripts/validate.sh

      - name: Validate Docker Compose model
        run: docker compose config --quiet
