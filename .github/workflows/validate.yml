name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/backend/requirements.txt 'PyYAML>=6,<7'
      - name: Validate source, schemas, OpenAPI, control-plane schema and docs
        run: ./scripts/validate.sh
      - name: Validate Docker Compose model
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env
