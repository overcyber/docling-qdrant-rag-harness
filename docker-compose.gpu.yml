# Docker Compose override file to enable NVIDIA GPU acceleration for Docling Parser and Embedder
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  parser-docling:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  embedder:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
