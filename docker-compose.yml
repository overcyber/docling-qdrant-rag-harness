name: docling-rag-harness

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || grep -q '18BD' /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_BIND_HOST:-127.0.0.1}:${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_BIND_HOST:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    profiles: ["events"]
    restart: unless-stopped

  parser-docling:
    build:
      context: ./services/parser
    env_file: .env
    environment:
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
      CHUNKER_TYPE: ${CHUNKER_TYPE:-hybrid}
      CHUNK_TOKENIZER_MODEL: ${CHUNK_TOKENIZER_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-120}
      CHUNK_HYBRID_MERGE_PEERS: ${CHUNK_HYBRID_MERGE_PEERS:-true}
      CHUNK_HYBRID_REPEAT_TABLE_HEADER: ${CHUNK_HYBRID_REPEAT_TABLE_HEADER:-true}
      CHUNK_HYBRID_OMIT_HEADER_ON_OVERFLOW: ${CHUNK_HYBRID_OMIT_HEADER_ON_OVERFLOW:-false}
      CHUNK_HYBRID_ALWAYS_EMIT_HEADINGS: ${CHUNK_HYBRID_ALWAYS_EMIT_HEADINGS:-false}
      CHUNK_HIERARCHICAL_MERGE_LIST_ITEMS: ${CHUNK_HIERARCHICAL_MERGE_LIST_ITEMS:-true}
      CHUNK_HIERARCHICAL_ALWAYS_EMIT_HEADINGS: ${CHUNK_HIERARCHICAL_ALWAYS_EMIT_HEADINGS:-false}
      CHUNK_LINE_PREFIX: ${CHUNK_LINE_PREFIX:-}
      CHUNK_LINE_OMIT_PREFIX_ON_OVERFLOW: ${CHUNK_LINE_OMIT_PREFIX_ON_OVERFLOW:-false}
      PDF_DO_OCR: ${PDF_DO_OCR:-true}
      PDF_DO_TABLE_STRUCTURE: ${PDF_DO_TABLE_STRUCTURE:-true}
      PDF_DO_CELL_MATCHING: ${PDF_DO_CELL_MATCHING:-true}
      DOCLING_MAX_NUM_PAGES: ${DOCLING_MAX_NUM_PAGES:-1000}
      PARSER_FULL_DOCLING_METADATA: ${PARSER_FULL_DOCLING_METADATA:-false}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      - hf_models:/models/huggingface
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  embedder:
    build:
      context: ./services/embedder
    env_file: .env
    environment:
      DENSE_MODEL: ${DENSE_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      SPARSE_MODEL: ${SPARSE_MODEL:-Qdrant/bm25}
      BM25_LANGUAGE: ${BM25_LANGUAGE:-portuguese}
      RERANKER_MODEL: ${RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      FASTEMBED_CACHE_PATH: /models/fastembed
    volumes:
      - fastembed_models:/models/fastembed
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./services/backend
    command:
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
      - --timeout-keep-alive
      - "${API_KEEP_ALIVE:-5}"
      - --log-level
      - "${API_LOG_LEVEL:-info}"
    env_file: .env
    environment:
      SERVICE_NAME: api
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      NATS_URL: nats://nats:4222
      OLLAMA_BASE_URL: http://ollama:11434
      LLAMA_CPP_BASE_URL: http://llama-cpp:8080/v1
      VLLM_BASE_URL: http://vllm:8000/v1
      PARSER_URL: http://parser-docling:8001
      EMBEDDER_URL: http://embedder:8002
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      parser-docling:
        condition: service_healthy
      embedder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./services/backend
    command:
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=${WORKER_LOG_LEVEL:-INFO}
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=${WORKER_MAX_TASKS_PER_CHILD:-20}
    env_file: .env
    environment:
      SERVICE_NAME: worker
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      NATS_URL: nats://nats:4222
      PARSER_URL: http://parser-docling:8001
      EMBEDDER_URL: http://embedder:8002
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      parser-docling:
        condition: service_healthy
      embedder:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    profiles: ["ollama"]
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-lc"]
    command: ["test -n '${OLLAMA_MODEL:-}' && ollama pull '${OLLAMA_MODEL}' || (echo 'Set OLLAMA_MODEL before using ollama-pull' && exit 2)"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    profiles: ["ollama-pull"]

  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - -m
      - ${LLAMA_CPP_MODEL_PATH:-/models/model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - ${LLAMA_CPP_CONTEXT_SIZE:-8192}
      - -np
      - ${LLAMA_CPP_PARALLEL:-2}
    volumes:
      - ${LLAMA_CPP_MODELS_DIR:-./models/llama.cpp}:/models:ro
    ports:
      - "${LLAMA_CPP_BIND_HOST:-127.0.0.1}:${LLAMA_CPP_PORT:-8080}:8080"
    profiles: ["llama-cpp"]
    restart: unless-stopped

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    command:
      - --model
      - ${VLLM_MODEL:-}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --generation-config
      - vllm
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_models:/root/.cache/huggingface
    ports:
      - "${VLLM_BIND_HOST:-127.0.0.1}:${VLLM_PORT:-8005}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["vllm"]
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material:9.6.20
    working_dir: /workspace
    command: ["serve", "--dev-addr=0.0.0.0:8004"]
    volumes:
      - ./:/workspace:ro
    ports:
      - "${DOCS_BIND_HOST:-127.0.0.1}:${DOCS_PORT:-8004}:8004"
    profiles: ["documentation"]
    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "${FLOWER_BIND_HOST:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["monitoring"]
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  uploads:
  hf_models:
  fastembed_models:
  ollama_models:
